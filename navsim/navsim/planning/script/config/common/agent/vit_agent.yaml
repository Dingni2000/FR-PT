_target_: navsim.agents.vit_agent.vit_agent.ViTTrajectoryAgent
_convert_: 'all'

config:
  _target_: navsim.agents.vit_agent.vit_config.ViTConfig
  _convert_: 'all'

  trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    _convert_: 'all'
    time_horizon: 4
    interval_length: 0.5

  # Same current-frame preprocessing and cache as the ResNet agent.
  camera_history_index: 3
  image_height: 256
  image_width: 1024
  side_crop_height: 28
  side_crop_width: 416
  front_crop_height: 28
  feature_cache_name: camera_status_feature_v1

  image_architecture: vit_b16_google_i21k_in1k_224
  # Set FRPT_VIT_B16_IMAGENET_CKPT to a local ViT-B/16 checkpoint.
  image_checkpoint_path: ${oc.env:FRPT_VIT_B16_IMAGENET_CKPT,null}
  load_imagenet_checkpoint: true
  freeze_image_encoder: false

  normalize_image: true
  image_mean: [0.5, 0.5, 0.5]
  image_std: [0.5, 0.5, 0.5]

  vit_patch_size: 16
  vit_embed_dim: 768
  vit_mlp_dim: 3072
  vit_depth: 12
  vit_num_heads: 12
  vit_dropout_rate: 0.1
  vit_attention_dropout: 0.0
  vit_layer_norm_eps: 1.0e-5

  # Memory-safe tokenization: 8 x 32 pooled tokens plus the CLS token.
  vit_token_grid_height: 8
  vit_token_grid_width: 32
  vit_backbone_chunk_size: 16

  force_backbone_bf16: true
  strict_memory_efficient_attention: true
  use_gradient_checkpointing: true

  image_embedding_dim: 512
  status_input_dim: 8
  status_intermediate_dim: 64
  status_context_dim: 128
  modulation_scale: 0.1
  planning_hidden_dim: 256
  leaky_relu_slope: 0.5

  backbone_lr: 1.0e-5
  weight_decay: 1.0e-4
  return_reconstruction_features: true
  retain_reconstruction_feature_gradients: false
  reconstruction_vit_layer_index: 10

lr: 1.0e-4
checkpoint_path: null
