_target_: navsim.agents.resnet_agent.resnet_agent.ResNetTrajectoryAgent
_convert_: 'all'

config:
  _target_: navsim.agents.resnet_agent.resnet_config.ResNetConfig
  _convert_: 'all'

  trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    _convert_: 'all'
    time_horizon: 4
    interval_length: 0.5

  camera_history_index: 3
  image_height: 256
  image_width: 1024
  side_crop_height: 28
  side_crop_width: 416
  front_crop_height: 28
  feature_cache_name: camera_status_feature_v1

  image_architecture: resnet34

  # Set FRPT_RESNET34_IMAGENET_CKPT to a local official-compatible ResNet34 state dict.
  image_checkpoint_path: ${oc.env:FRPT_RESNET34_IMAGENET_CKPT,null}
  load_imagenet_checkpoint: true

  freeze_image_encoder: false
  normalize_image: true
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]
  spatial_pool_height: 1
  spatial_pool_width: 4
  image_embedding_dim: 512

  # Use stages for reconstruction features; set to none for normal inference.
  backbone_feature_capture: stages
  retain_backbone_feature_gradients: false

  status_input_dim: 8
  status_intermediate_dim: 64
  status_context_dim: 128
  modulation_scale: 0.1

  planning_hidden_dim: 256
  leaky_relu_slope: 0.5
  weight_decay: 1.0e-4
  backbone_lr_scale: 0.1
  return_intermediate_features: true

lr: 1.0e-4
checkpoint_path: null
